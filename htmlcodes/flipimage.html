<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flip Card</title>

<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f2f2f2;
    font-family: Arial;
}

.flip-card {
    width: 250px;
    height: 150px;
    perspective: 1000px;
}

.flip-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s;
}

.flip-card:hover .flip-inner {
    transform: rotateY(180deg);
}

.flip-front,
.flip-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    border-radius: 12px;
    color: white;
}

.flip-front {
    background: #4a6cff;
}

.flip-back {
    background: #ff6b6b;
    transform: rotateY(180deg); /* makes text readable */
}
</style>
</head>
