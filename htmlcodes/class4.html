<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: pink;
        }

        h1 {
            text-align: center;
            text-decoration: underline;
            font-style: italic;
        }

        #parent {
            padding: 20px;
            background: rgb(213, 26, 26);
            border: 2px solid rgb(239, 239, 240);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-around;
        }

        .box {
            width: 100px;
            height: 100px;
            border: 2px solid rgb(73, 5, 73);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: rgb(233, 150, 232);
            background-color: rgb(15, 13, 15);
        }
    </style>
</head>

<body>

    <h1>Flexbox Practice Day 2</h1>

    <div id="parent">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>

</body>

</html>
